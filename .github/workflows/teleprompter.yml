name: Build Teleprompter

on:
  workflow_dispatch:
  push:
    paths:
      - "teleprompter/**"
      - ".github/workflows/teleprompter.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash teleprompter/build.sh
      - name: Zip app
        run: cd teleprompter && ditto -c -k --keepParent Teleprompter.app Teleprompter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Teleprompter
          path: teleprompter/Teleprompter.zip
